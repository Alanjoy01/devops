name: Staging CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build and Test
        run: mvn -f maven-automation-pipeline/pom.xml clean verify

      - name: Package Application
        run: mvn -f maven-automation-pipeline/pom.xml package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-java-app
          path: maven-automation-pipeline/target/*.jar

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: staging

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-java-app
          path: staging-artifact

      - name: Confirm Staging Artifact
        run: |
          echo "Staging artifact downloaded successfully."
          ls -lh staging-artifact/
