name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: maven-automation-pipeline

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: maven-automation-pipeline/pom.xml

      - name: Build and Run Tests
        working-directory: maven-automation-pipeline
        run: mvn clean test

      - name: Package Application
        working-directory: maven-automation-pipeline
        run: mvn package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jdk-${{ matrix.java-version }}
          path: maven-automation-pipeline/target/*.jar
