name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build and Run Tests
        run: mvn clean test

      - name: Package Application
        run: mvn package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jdk-${{ matrix.java-version }}
          path: target/*.jar

  staging-deployment:
    name: Automatic Staging Deployment
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: staging

    steps:
      - name: Download Java Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jdk-17
          path: staging-artifact

      - name: Verify Staging Artifact
        run: |
          echo "Staging deployment started."
          ls -lh staging-artifact/

  production-deployment:
    name: Automatic Production Deployment
    runs-on: ubuntu-latest
    needs: staging-deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Java Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jdk-17
          path: production-artifact

      - name: Verify Production Artifact
        run: |
          echo "Production deployment started."
          ls -lh production-artifact/
